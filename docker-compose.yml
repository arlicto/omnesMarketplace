services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: omnes_php
    volumes:
      - ./backend:/var/www/backend
    networks:
      - omnes_network

  nginx:
    image: nginx:alpine
    container_name: omnes_nginx
    ports:
      - "8081:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - frontend
    networks:
      - omnes_network

  db:
    image: mysql:8.0
    container_name: omnes_db
    restart: always
    environment:
      MYSQL_DATABASE: omnes_db
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: omnes_user
      MYSQL_PASSWORD: omnes_password
    ports:
      - "3307:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - omnes_network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: omnes_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8081/api/v1
    networks:
      - omnes_network

networks:
  omnes_network:
    driver: bridge
