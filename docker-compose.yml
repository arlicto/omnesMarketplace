services:
  # PHP-FPM Backend Service
  php:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: omnes_php
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: ${APP_ENV:-dev}
    volumes:
      - ./backend:/var/www/backend
      - backend_storage:/var/www/backend/storage
      - backend_uploads:/var/www/backend/public/uploads
    networks:
      - omnes_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: omnes_nginx
    ports:
      - "${NGINX_PORT:-8081}:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - backend_uploads:/var/www/backend/public/uploads:ro
    depends_on:
      - php
      - frontend
    networks:
      - omnes_network
    restart: unless-stopped

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: omnes_db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-omnes_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema:/docker-entrypoint-initdb.d
    networks:
      - omnes_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend Development Server
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      target: development
    container_name: omnes_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8081/api/v1}
    networks:
      - omnes_network
    restart: unless-stopped

networks:
  omnes_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  backend_storage:
    driver: local
  backend_uploads:
    driver: local

