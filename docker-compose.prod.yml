services:
  # PHP-FPM Backend Service (Production)
  php:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: omnes_php_prod
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
    volumes:
      - backend_storage:/var/www/backend/storage
      - backend_uploads:/var/www/backend/public/uploads
    networks:
      - omnes_network
    restart: always

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: omnes_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf
      - backend_uploads:/var/www/backend/public/uploads:ro
      - ./frontend/dist:/var/www/frontend/dist:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - php
      - frontend
    networks:
      - omnes_network
    restart: always

  # MySQL Database (Production)
  db:
    image: mysql:8.0
    container_name: omnes_db_prod
    restart: always
    env_file:
      - ./backend/.env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema:/docker-entrypoint-initdb.d
    networks:
      - omnes_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend Production Server
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      target: production
    container_name: omnes_frontend_prod
    volumes:
      - frontend_dist:/app/dist
    environment:
      - VITE_API_URL=${VITE_API_URL:-https://api.example.com/api/v1}
    networks:
      - omnes_network
    restart: always

networks:
  omnes_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  backend_storage:
    driver: local
  backend_uploads:
    driver: local
  frontend_dist:
    driver: local
  nginx_logs:
    driver: local
